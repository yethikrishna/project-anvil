[package]
name = "anvil-image-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly image processing pipeline for Project Anvil"
authors = ["Anvil Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "ImageData",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "gif"]

[profile.release]
opt-level = 3
lto = true
