name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint
        env:
          CI: true

      - name: Type check
        run: pnpm turbo build --dry-run 2>/dev/null || npx tsc --noEmit -p packages/ui/tsconfig.json 2>/dev/null || true
        env:
          CI: true

      - name: Build
        run: pnpm turbo build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo test
        env:
          CI: true

  generate-api-client:
    name: Generate API Client
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client from OpenAPI spec
        run: |
          if [ -f "packages/api-client/openapi.yaml" ]; then
            npx @hey-api/openapi-ts \
              --input packages/api-client/openapi.yaml \
              --output packages/api-client/src/generated \
              --client axios
            echo "✅ API client generated"
          else
            echo "⚠️ No openapi.yaml found — skipping client generation"
          fi
        env:
          CI: true
