# Render Blueprint — Project Anvil Backend Services
# Deploy with: render blueprint deploy

services:
  # ── Drive API ──
  - type: web
    name: anvil-drive-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: apps/drive/api
    buildCommand: cd ../../.. && npm install && npx turbo build --filter=drive
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3100
      - key: DATABASE_URL
        fromDatabase:
          name: anvil-db
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: anvil-drive
    # Keep-warm cron to avoid cold starts
    crons:
      - schedule: "*/14 * * * *"
        command: "curl -sf http://localhost:3100/health > /dev/null"

  # ── Docs Hocuspocus Server ──
  - type: web
    name: anvil-docs-ws
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: apps/docs/api
    buildCommand: cd ../../.. && npm install && npx turbo build --filter=docs
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3200
      - key: DATABASE_URL
        fromDatabase:
          name: anvil-db
          property: connectionString
    crons:
      - schedule: "*/14 * * * *"
        command: "curl -sf http://localhost:3200/health > /dev/null"

  # ── Search API ──
  - type: web
    name: anvil-search-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: apps/search/api
    buildCommand: cd ../../.. && npm install && npx turbo build --filter=search
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4015
      - key: MEILISEARCH_HOST
        sync: false
      - key: MEILISEARCH_KEY
        sync: false
    crons:
      - schedule: "*/14 * * * *"
        command: "curl -sf http://localhost:4015/health > /dev/null"

  # ── Notification Server ──
  - type: web
    name: anvil-notifications
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: packages/notifications
    buildCommand: cd ../.. && npm install
    startCommand: npx tsx src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4020
    crons:
      - schedule: "*/14 * * * *"
        command: "curl -sf http://localhost:4020/health > /dev/null"

# ── Database ──
databases:
  - name: anvil-db
    databaseName: anvil
    plan: starter
    region: oregon
    user: anvil_app
