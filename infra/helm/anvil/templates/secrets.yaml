apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anvil.fullname" . }}-secrets
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "anvil.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
  redis-url: "redis://:{{ .Values.redis.password }}@{{ include "anvil.fullname" . }}-redis:6379"
  keycloak-admin-password: {{ .Values.keycloak.admin.password | quote }}
  minio-root-password: {{ .Values.minio.rootPassword | default (randAlphaNum 32) | quote }}
  meilisearch-master-key: {{ .Values.meilisearch.masterKey | default (randAlphaNum 32) | quote }}
  nextauth-secret: {{ .Values.nextauth.secret | default (randAlphaNum 32) | quote }}
  stripe-secret-key: {{ .Values.stripe.secretKey | default "" | quote }}
  stripe-webhook-secret: {{ .Values.stripe.webhookSecret | default "" | quote }}
  license-secret: {{ .Values.license.secret | default (randAlphaNum 32) | quote }}
---
{{- if .Values.security.encryption.hsm.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anvil.fullname" . }}-hsm
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
type: Opaque
stringData:
  hsm-type: {{ .Values.security.encryption.hsm.type | quote }}
  {{- if eq .Values.security.encryption.hsm.type "aws-kms" }}
  aws-region: {{ .Values.security.encryption.hsm.awsRegion | default "us-east-1" | quote }}
  aws-key-id: {{ .Values.security.encryption.hsm.awsKeyId | default "" | quote }}
  {{- end }}
  {{- if eq .Values.security.encryption.hsm.type "gcp-kms" }}
  gcp-project: {{ .Values.security.encryption.hsm.gcpProject | default "" | quote }}
  gcp-keyring: {{ .Values.security.encryption.hsm.gcpKeyring | default "anvil-keyring" | quote }}
  gcp-key: {{ .Values.security.encryption.hsm.gcpKey | default "anvil-tenant-key" | quote }}
  {{- end }}
{{- end }}
