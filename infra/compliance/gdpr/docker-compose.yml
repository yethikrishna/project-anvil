# Anvil GDPR Compliance Deployment
# EU data protection compliant configuration.
#
# GDPR Requirements Addressed:
# - Data residency (EU-only processing)
# - Right to erasure (automated data deletion)
# - Data portability (export in standard formats)
# - Consent management
# - Data Protection Impact Assessment (DPIA) ready
# - Data Processing Records (Article 30)
# - Breach notification infrastructure
# - Privacy by design / by default

version: "3.9"

services:
  # ── Traefik (EU region TLS) ──
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - anvil-net
    restart: always

  # ── Keycloak (EU instance) ──
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${ANVIL_DOMAIN}
      KC_SSL_REQUIRED: external
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - anvil-net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.${ANVIL_DOMAIN}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"

  # ── PostgreSQL (EU region, GDPR-compliant) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: anvil
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/gdpr-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - anvil-net
    restart: always
    command: >
      postgres
        -c ssl=on
        -c log_connections=yes
        -c log_statement=ddl
        -c log_replication_commands=yes

  # ── Consent Management Service ──
  consent-manager:
    build:
      context: ../../
      dockerfile: infra/compliance/Dockerfile.consent
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/anvil
    networks:
      - anvil-net
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # ── Data Erasure Service (right to be forgotten) ──
  erasure-service:
    build:
      context: ../../
      dockerfile: infra/compliance/Dockerfile.erasure
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/anvil
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
    networks:
      - anvil-net
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # ── Data Portability Service ──
  export-service:
    build:
      context: ../../
      dockerfile: infra/compliance/Dockerfile.export
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/anvil
      EXPORT_FORMATS: "json,csv,pdf"
    volumes:
      - export_data:/exports
    networks:
      - anvil-net
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: valkey/valkey:8-alpine
    volumes:
      - redis_data:/data
    networks:
      - anvil-net
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - anvil-net
    restart: always

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY}
    volumes:
      - meili_data:/meili_data
    networks:
      - anvil-net
    restart: always

volumes:
  keycloak_data:
  pg_data:
  redis_data:
  minio_data:
  meili_data:
  letsencrypt:
  export_data:

networks:
  anvil-net:
    driver: bridge

x-gdpr-controls:
  data_residency: "EU-only processing — all services run in EU region"
  right_to_erasure: "Automated deletion across all data stores within 30 days"
  data_portability: "Export user data in JSON/CSV/PDF on demand"
  consent_management: "Granular consent tracking per processing purpose"
  breach_notification: "Automated detection + 72-hour DPA notification pipeline"
  privacy_by_design: "Minimal data collection, purpose limitation, storage limitation"
  dpia: "Data Protection Impact Assessment template included"
  article_30: "Processing records maintained automatically"
  dpo_contact: "Configure DPO_EMAIL in .env"
