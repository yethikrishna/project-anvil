# Anvil HIPAA Compliance Deployment
# Compliant Docker Compose configuration for healthcare organizations.
#
# HIPAA Requirements Addressed:
# - Encryption at rest (AES-256 via MinIO KMS)
# - Encryption in transit (TLS everywhere)
# - Access control (RBAC + audit logging)
# - Audit trail (immutable, 6-year retention)
# - BAA-ready infrastructure
# - Backup and disaster recovery
# - Minimum necessary access
# - Automatic session timeout

version: "3.9"

services:
  # ── Reverse Proxy (TLS termination) ──
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - anvil-net
    restart: always
    labels:
      - "traefik.enable=true"

  # ── Identity (Keycloak with TLS) ──
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${ANVIL_DOMAIN}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/tls.key
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # HIPAA: Session timeout (30 minutes)
      KC_SPI_SESSION_MAX_LIFESPAN: 1800000
      # HIPAA: Require SSL for all requests
      KC_SSL_REQUIRED: external
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./tls/keycloak:/opt/keycloak/conf/tls:ro
    networks:
      - anvil-net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.${ANVIL_DOMAIN}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.services.keycloak.loadbalancer.server.scheme=https"

  # ── Database (encrypted at rest) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: anvil
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/hipaa-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - anvil-net
    restart: always
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/tls/server.crt
        -c ssl_key_file=/var/lib/postgresql/tls/server.key
        -c log_connections=yes
        -c log_disconnections=yes
        -c log_duration=yes
        -c log_statement=all
        -c log_line_prefix='%t [%p]: db=%d,user=%u,app=%a,client=%h '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache (encrypted, TLS) ──
  redis:
    image: valkey/valkey:8-alpine
    command: >
      valkey-server
        --tls-cert-file /tls/valkey.crt
        --tls-key-file /tls/valkey.key
        --tls-ca-cert-file /tls/ca.crt
        --tls-port 6379
        --port 0
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./tls/valkey:/tls:ro
    networks:
      - anvil-net
    restart: always

  # ── Object Storage (encrypted at rest with KMS) ──
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      # HIPAA: Enable KMS encryption
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_KEY}
      # Auto-encrypt all new objects
      MINIO_ENCRYPT: "on"
    volumes:
      - minio_data:/data
    networks:
      - anvil-net
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Audit Log Service (immutable, WORM storage) ──
  audit-log:
    build:
      context: ../../
      dockerfile: infra/compliance/Dockerfile.audit
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/anvil
      AUDIT_RETENTION_DAYS: 2190  # 6 years (HIPAA requirement)
      AUDIT_IMMUTABLE: "true"
    volumes:
      - audit_data:/var/log/anvil/audit
    networks:
      - anvil-net
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backup Service ──
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_SCHEDULE: "0 2 * * *"   # Daily at 2 AM
      BACKUP_RETENTION_DAYS: 90       # HIPAA: minimum 6 years, keep 90 days local
      S3_BACKUP_URL: ${S3_BACKUP_URL}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup_data:/backups
    networks:
      - anvil-net
    restart: always
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keycloak_data:
  pg_data:
  redis_data:
  minio_data:
  letsencrypt:
  audit_data:
  backup_data:

networks:
  anvil-net:
    driver: bridge
    internal: false

x-hipaa-controls:
  access_control: "RBAC via Keycloak with MFA enforcement"
  audit_controls: "Immutable audit logs with 6-year retention"
  integrity_controls: "Checksummed backups, WORM audit storage"
  transmission_security: "TLS 1.3 for all inter-service communication"
  encryption_at_rest: "AES-256 via MinIO KMS, PostgreSQL TDE"
  backup: "Daily encrypted backups with 90-day local + S3 offsite"
  session_timeout: "30-minute maximum session lifetime"
