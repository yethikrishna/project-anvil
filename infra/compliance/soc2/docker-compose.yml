# Anvil SOC 2 Type II Compliance Deployment
# Trust Service Criteria: Security, Availability, Confidentiality
#
# SOC 2 Requirements Addressed:
# - Access control (least privilege, MFA, SSO)
# - Encryption (at rest + in transit)
# - Monitoring and alerting
# - Incident response
# - Change management
# - Vulnerability management
# - Backup and recovery
# - Network security

version: "3.9"

services:
  # ── Traefik with security headers ──
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addentrypointslabels=true"
    ports:
      - "80:80"
      - "443:443"
      - "9090:9090"  # Prometheus metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik_logs:/var/log/traefik
    networks:
      - anvil-net
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${ANVIL_DOMAIN}
      KC_SSL_REQUIRED: external
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # SOC2: Brute force protection
      KC_SPI_BRUTE_FORCE_ENABLED: "true"
      KC_SPI_BRUTE_FAILURE_RESET_TIME: 900
      KC_SPI_BRUTE_MAX_FAILURES: 5
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - anvil-net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: anvil
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - anvil-net
    restart: always
    command: >
      postgres
        -c ssl=on
        -c log_connections=yes
        -c log_disconnections=yes
        -c log_statement=ddl
        -c log_line_prefix='%t [%p]: db=%d,user=%u '
        -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    command: valkey-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb
    volumes:
      - redis_data:/data
    networks:
      - anvil-net
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - anvil-net
    restart: always

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY}
    volumes:
      - meili_data:/meili_data
    networks:
      - anvil-net
    restart: always

  # ── Monitoring Stack ──
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - anvil-net
    restart: always

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - anvil-net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitoring.${ANVIL_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"

  # ── Log Aggregation ──
  loki:
    image: grafana/loki:latest
    volumes:
      - loki_data:/loki
    networks:
      - anvil-net
    restart: always

  # ── Vulnerability Scanner ──
  trivy:
    image: aquasec/trivy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache
    networks:
      - anvil-net
    restart: "no"

volumes:
  keycloak_data:
  pg_data:
  redis_data:
  minio_data:
  meili_data:
  letsencrypt:
  traefik_logs:
  prometheus_data:
  grafana_data:
  loki_data:
  trivy_cache:

networks:
  anvil-net:
    driver: bridge

x-soc2-controls:
  security:
    - "TLS 1.3 for all external communication"
    - "AES-256 encryption at rest"
    - "MFA enforced for all admin access"
    - "Network segmentation via Docker networks"
  availability:
    - "Multi-zone deployment ready"
    - "Automated backups with tested restore"
    - "Health checks on all services"
    - "Uptime monitoring via Prometheus/Grafana"
  confidentiality:
    - "RBAC with least privilege"
    - "Audit logging of all access"
    - "Encrypted backups"
    - "Secret management via .env (upgrade to Vault for production)"
  monitoring:
    - "Prometheus metrics collection"
    - "Grafana dashboards"
    - "Loki log aggregation"
    - "Trivy vulnerability scanning"
