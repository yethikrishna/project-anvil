#:schema node_modules/wrangler/config-schema.json
# ── Unified Cloudflare Infrastructure Config ──
# Creates all required resources for the Anvil CF Free Stack

name = "anvil-edge-router"
main = "../../edge/search-router.ts"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]

# ── KV Namespaces ──

[[kv_namespaces]]
binding = "SESSIONS"
id = "placeholder_kv_sessions_id"     # Run: wrangler kv namespace create anvil-kv-sessions
preview_id = "placeholder_kv_sessions_preview"

[[kv_namespaces]]
binding = "CACHE"
id = "placeholder_kv_cache_id"         # Run: wrangler kv namespace create anvil-kv-cache
preview_id = "placeholder_kv_cache_preview"

# ── R2 Buckets (Drive BLOB storage) ──

[[r2_buckets]]
binding = "DRIVE_STORAGE"
bucket_name = "anvil-r2-drive"         # Run: wrangler r2 bucket create anvil-r2-drive

# ── D1 Database (edge metadata — optional, lightweight) ──

[[d1_databases]]
binding = "DB"
database_name = "anvil-d1-metadata"
database_id = "placeholder_d1_id"       # Run: wrangler d1 create anvil-d1-metadata

# ── Environment Variables ──

[vars]
ENVIRONMENT = "production"
NOMINATIM_URL = "https://nominatim.openstreetmap.org"
OSRM_URL = "https://router.project-osrm.org"

# Secrets (set via CLI):
# wrangler secret put MEILISEARCH_URL
# wrangler secret put MEILISEARCH_API_KEY
# wrangler secret put NEON_DATABASE_URL
# wrangler secret put BACKEND_URL
# wrangler secret put OPENAI_API_KEY

# ── Staging ──

[env.staging]
name = "anvil-edge-router-staging"
routes = [
  { pattern = "api-staging.anvil.dev/*", zone_name = "anvil.dev" }
]

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "placeholder_staging_sessions_id"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "placeholder_staging_cache_id"

[[env.staging.r2_buckets]]
binding = "DRIVE_STORAGE"
bucket_name = "anvil-r2-drive-staging"

# ── Production ──

[env.production]
name = "anvil-edge-router"
routes = [
  { pattern = "api.anvil.dev/*", zone_name = "anvil.dev" }
]

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "placeholder_prod_sessions_id"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "placeholder_prod_cache_id"

[[env.production.r2_buckets]]
binding = "DRIVE_STORAGE"
bucket_name = "anvil-r2-drive"
