# Anvil — Full Self-Hosted Stack
# Includes all infrastructure services and all Anvil application services.
#
# Usage:
#   docker compose up -d                  # Start all services
#   docker compose --profile demo up -d  # Include demo data seeder
#   docker compose --profile monitoring up -d  # Include Prometheus + Grafana
#
# Environment variables are read from .env (generated by scripts/install.sh)

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - anvil-net
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://${DB_USER:-anvil}:${DB_PASSWORD:-anvil_secret}@postgres:5432/anvil
    REDIS_URL: redis://:${REDIS_PASSWORD:-anvil_redis_secret}@redis:6379
    KEYCLOAK_URL: http://keycloak:8080
    KEYCLOAK_REALM: anvil
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_USER:-anvil}
    MINIO_SECRET_KEY: ${MINIO_PASSWORD:-anvil_minio_secret}
    MEILISEARCH_URL: http://meilisearch:7700
    MEILI_MASTER_KEY: ${MEILI_KEY:-anvil_meili_secret}
    ANVIL_DOMAIN: ${ANVIL_DOMAIN:-localhost}
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-anvil_nextauth_secret}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3000}/api/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

services:
  # ════════════════════════════════════════════════════════════
  # INFRASTRUCTURE SERVICES
  # ════════════════════════════════════════════════════════════

  # ── Identity Provider ──
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: >
      start
      --db=postgres
      --db-url=jdbc:postgresql://postgres:5432/keycloak_db
      --db-username=${DB_USER:-anvil}
      --db-password=${DB_PASSWORD:-anvil_secret}
      --hostname=${ANVIL_DOMAIN:-localhost}
      --hostname-strict=false
      --proxy-headers=xforwarded
      --http-enabled=true
      --health-enabled=true
      --metrics-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_LOG_LEVEL: WARN
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anvil-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-anvil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anvil_secret}
      POSTGRES_DB: anvil
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./infra/sql/002_multitenant.sql:/docker-entrypoint-initdb.d/01_multitenant.sql:ro
    networks:
      - anvil-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anvil} -d anvil"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c log_min_duration_statement=1000
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on

  # ── Valkey (Redis-compatible cache / session store) ──
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --requirepass ${REDIS_PASSWORD:-anvil_redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anvil-net
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-anvil_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO Object Storage ──
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-anvil}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-anvil_minio_secret}
      MINIO_BROWSER_REDIRECT_URL: https://${ANVIL_DOMAIN:-localhost}/minio
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_UPDATE: "off"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - anvil-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── MinIO bucket initializer (runs once) ──
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - anvil-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_USER:-anvil} ${MINIO_PASSWORD:-anvil_minio_secret};
        mc mb --ignore-existing local/anvil-drive;
        mc mb --ignore-existing local/anvil-mail-attachments;
        mc mb --ignore-existing local/anvil-backups;
        mc mb --ignore-existing local/anvil-avatars;
        mc mb --ignore-existing local/anvil-exports;
        mc anonymous set download local/anvil-avatars;
        echo 'MinIO buckets ready.';
      "

  # ── Meilisearch ──
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-anvil_meili_secret}
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 512Mb
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - anvil-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── Stalwart Mail Server ──
  stalwart:
    image: stalwartlabs/mail-server:latest
    restart: unless-stopped
    environment:
      MAIL_SERVER_HOSTNAME: mail.${ANVIL_DOMAIN:-localhost}
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "127.0.0.1:8082:8080"
    volumes:
      - stalwart_data:/opt/stalwart-mail
    networks:
      - anvil-net
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Caddy (TLS reverse proxy) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ANVIL_DOMAIN: ${ANVIL_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    networks:
      - anvil-net
    depends_on:
      - admin
      - blog

  # ════════════════════════════════════════════════════════════
  # ANVIL APPLICATION SERVICES
  # ════════════════════════════════════════════════════════════

  # ── Admin Console ──
  admin:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/admin:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      <<: *app-env
      PORT: "3008"
      NEXTAUTH_URL: https://${ANVIL_DOMAIN:-localhost}/admin
    ports:
      - "127.0.0.1:3008:3008"
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: "Host(`${ANVIL_DOMAIN:-localhost}`) && PathPrefix(`/admin`)"

  # ── Blog / Marketing ──
  blog:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/blog:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
    environment:
      <<: *app-env
      PORT: "3009"
      NEXTAUTH_URL: https://${ANVIL_DOMAIN:-localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      SMTP_API_URL: ${SMTP_API_URL:-}
      SMTP_API_KEY: ${SMTP_API_KEY:-}
    ports:
      - "127.0.0.1:3009:3009"

  # ── Docs ──
  docs:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/docs:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    environment:
      <<: *app-env
      PORT: "3000"
      NEXTAUTH_URL: https://docs.${ANVIL_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:3000:3000"

  # ── Drive ──
  drive:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/drive:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/drive/Dockerfile
    environment:
      <<: *app-env
      PORT: "3001"
      NEXTAUTH_URL: https://drive.${ANVIL_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:3001:3001"

  # ── Gmail (Webmail) ──
  gmail:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/gmail:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/gmail/Dockerfile
    environment:
      <<: *app-env
      PORT: "3002"
      NEXTAUTH_URL: https://mail.${ANVIL_DOMAIN:-localhost}
      IMAP_HOST: stalwart
      IMAP_PORT: "143"
      SMTP_HOST: stalwart
      SMTP_PORT: "587"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - stalwart

  # ── Calendar ──
  calendar:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/calendar:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/calendar/Dockerfile
    environment:
      <<: *app-env
      PORT: "3003"
      NEXTAUTH_URL: https://calendar.${ANVIL_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:3003:3003"

  # ── Search ──
  search:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/search:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/search/Dockerfile
    environment:
      <<: *app-env
      PORT: "3004"
      NEXTAUTH_URL: https://search.${ANVIL_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:3004:3004"

  # ── Chat ──
  chat:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/chat:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
    environment:
      <<: *app-env
      PORT: "3006"
      NEXTAUTH_URL: https://chat.${ANVIL_DOMAIN:-localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:3006:3006"

  # ── Tasks ──
  tasks:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/tasks:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/tasks/Dockerfile
    environment:
      <<: *app-env
      PORT: "3007"
      NEXTAUTH_URL: https://tasks.${ANVIL_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:3007:3007"

  # ── Marketplace ──
  marketplace:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io/anvil-org}/marketplace:${ANVIL_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/marketplace/Dockerfile
    environment:
      <<: *app-env
      PORT: "3010"
      NEXTAUTH_URL: https://marketplace.${ANVIL_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:3010:3010"

  # ════════════════════════════════════════════════════════════
  # OPTIONAL: MONITORING (--profile monitoring)
  # ════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v3.0.0
    restart: unless-stopped
    profiles: ["monitoring", "soc2"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/compliance/soc2/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/compliance/soc2/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - anvil-net

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    profiles: ["monitoring", "soc2"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/compliance/soc2/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - anvil-net
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ["monitoring", "soc2"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/compliance/soc2/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - anvil-net

  # ════════════════════════════════════════════════════════════
  # OPTIONAL: DEMO DATA SEEDER (--profile demo)
  # ════════════════════════════════════════════════════════════

  demo-seeder:
    image: node:22-alpine
    restart: "no"
    profiles: ["demo"]
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache postgresql-client curl &&
        npm install -g tsx &&
        tsx /app/scripts/seed-demo.ts
      "
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      POSTGRES_URL: postgresql://${DB_USER:-anvil}:${DB_PASSWORD:-anvil_secret}@postgres:5432/anvil
      MEILISEARCH_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_KEY:-anvil_meili_secret}
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_USER:-anvil}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-anvil_minio_secret}
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - anvil-net

volumes:
  keycloak_data:
  pg_data:
  redis_data:
  minio_data:
  meili_data:
  stalwart_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  anvil-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
